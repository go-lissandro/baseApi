version: '3.8'

services:
  database:
    container_name: go-db
    image: postgres:16.0-alpine3.18
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/data
  server:
    container_name: go-server
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # dentro do compose o Postgres é acessado pelo nome do serviço
      POSTGRES_HOST: database
    depends_on:
      - database
    ports:
      - "3000:3000"
volumes:
  data: